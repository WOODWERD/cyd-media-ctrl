name: Windows helper

on:
  push:
    paths:
      - 'windows-helper/**'
      - '.github/workflows/windows-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet run --project windows-helper/Tests
      - name: Build
        run: dotnet publish windows-helper/App -c Release -o publish
      - name: Package
        shell: pwsh
        run: Copy-Item windows-helper/install.cmd, windows-helper/install.ps1, windows-helper/start.cmd, windows-helper/stop.cmd, windows-helper/uninstall.cmd publish
      - uses: actions/upload-artifact@v4
        with:
          name: media-ctrl-windows-helper
          path: |
            publish/MediaCtrlHelper.exe
            publish/*.cmd
            publish/*.ps1
