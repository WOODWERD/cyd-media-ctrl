site_name: Media Ctrl
site_description: A desk media remote for the iPad on the ESP32 Cheap Yellow Display — now playing, transport and volume over Bluetooth.
site_url: https://WOODWERD.github.io/cyd-media-ctrl/
repo_url: https://github.com/WOODWERD/cyd-media-ctrl
repo_name: cyd-media-ctrl
edit_uri: edit/main/docs/
copyright: "© 2026 WOODWERD LLC · MIT · Unofficial, not affiliated with Apple or Spotify"
docs_dir: docs
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle: { icon: material/brightness-4, name: Light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle: { icon: material/brightness-7, name: Dark mode }
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
nav:
  - Home: index.md
  - Getting started: GETTING_STARTED.md
  - Flash it: flash/index.md
  - Firmware & code: firmware.md
  - Bench test: TESTING.md
  - Changelog: changelog.md
  - Notices & license: notices.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
plugins:
  - search
