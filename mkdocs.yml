site_name: Media Ctrl
site_description: A desk media remote for the iPad on the ESP32 Cheap Yellow Display — now playing, transport and volume over Bluetooth.
site_url: https://WOODWERD.github.io/cyd-media-ctrl/
repo_url: https://github.com/WOODWERD/cyd-media-ctrl
repo_name: cyd-media-ctrl
edit_uri: edit/main/docs/
copyright: "© 2026 WOODWERD LLC · MIT · Unofficial, not affiliated with Apple or Spotify"
docs_dir: docs
theme:
  name: material
  custom_dir: docs-theme/overrides   # WOODWERD/ctrl-docs-theme, checked out at build time
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle: { icon: material/monitor, name: "Theme: match my computer's setting" }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: "Theme: light" }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: "Theme: dark" }
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
extra_css:
  - assets/woodwerd/woodwerd.css
extra:
  purpose: 'Media remote for the Mac and iPad.'
  version: v0.2.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WOODWERD
      name: WOODWERD on GitHub
    - icon: material/web
      link: https://woodwerd.com
      name: woodwerd.com
nav:
  - Home: index.md
  - Getting started: GETTING_STARTED.md
  - Flash it: flash/index.md
  - On a Mac: MAC.md
  - Firmware & code: firmware.md
  - Bench test: TESTING.md
  - Case & parts: https://github.com/WOODWERD/cyd-case
  - Changelog: changelog.md
  - Notices & license: notices.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
plugins:
  - search
